<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital CTMS</title>
  <style>
    :root {
      --primary: #0f172a;
      --secondary: #1e40af;
      --accent: #00d4ff;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, #1e3a5f 100%);
      min-height: 100vh;
      color: var(--text);
    }

    /* Login */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      overflow: hidden;
      max-width: 900px;
      width: 100%;
    }

    .login-brand {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      padding: 60px 50px;
      width: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-brand .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--accent), #10b981);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 30px;
    }

    .login-brand h1 {
      font-size: 32px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--accent), #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-brand p {
      color: var(--text-muted);
    }

    form {
      padding: 60px 50px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      transition: all 0.3s;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.2);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
    }

    .hint {
      text-align: center;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Dashboard */
    .dashboard {
      min-height: 100vh;
    }

    .topbar {
      background: var(--surface);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .topbar .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar .brand .icon {
      font-size: 24px;
    }

    .topbar .brand .title {
      font-size: 18px;
      font-weight: 700;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: rgba(0, 212, 255, 0.2);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-logout:hover {
      background: var(--danger);
      color: white;
    }

    .content {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
    }

    .stat-card .stat-value {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .stat-card .stat-label {
      color: var(--text-muted);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card.normal .stat-value { color: var(--success); }
    .stat-card.anomaly .stat-value { color: var(--danger); }
    .stat-card.rate .stat-value { color: var(--warning); }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .panel {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
    }

    .panel h2 {
      font-size: 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .predict-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .form-row:last-of-type {
      grid-template-columns: 1fr 1fr 1fr;
    }

    #predict-result {
      margin-top: 16px;
    }

    .result {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      border-radius: 12px;
      animation: slideIn 0.5s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result.normal {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
    }

    .result.anomaly {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
    }

    .result-icon {
      font-size: 40px;
    }

    .result-text strong {
      display: block;
      margin-bottom: 4px;
    }

    .alerts-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    .alert-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: var(--bg);
      border-radius: 12px;
      border-left: 4px solid var(--warning);
    }

    .alert-item.severity-critical { border-left-color: var(--danger); }
    .alert-item.severity-low { border-left-color: var(--text-muted); }

    .alert-info strong {
      display: block;
      margin-bottom: 4px;
    }

    .alert-info .severity {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-right: 8px;
    }

    .alert-info small {
      color: var(--text-muted);
    }

    .btn-resolve {
      background: var(--success);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-resolve:hover {
      transform: scale(1.05);
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    @media (max-width: 1024px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .panels { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: repeat(2, 1fr); }
      .login-brand { width: 100%; padding: 40px; }
      .login-card { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script type="module" src="/app-new.js"></script>
</body>
</html>
